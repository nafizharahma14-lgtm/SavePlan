<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Fredoka&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --bg: linear-gradient(135deg,#fdf2f8,#fff7ed,#f1f5f9);
 --card:#fff;
 --grad: linear-gradient(120deg,#f9a8d4,#fb7185,#fdba74);
 --text:#334155;
}
.dark{
 --bg: linear-gradient(135deg,#0f172a,#1e293b);
 --card:#1e293b;
 --grad: linear-gradient(120deg,#334155,#475569);
 --text:#e2e8f0;
}

body{
 margin:0;
 font-family:Quicksand;
 background:var(--bg);
 color:var(--text);
 padding:10px;
}

#splash{
 position:fixed;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 background:var(--bg);
 z-index:999;
 animation:fade 1s forwards;
 animation-delay:2.5s;
}
@keyframes fade{to{opacity:0;visibility:hidden}}

.logo{
 font-family:Pacifico;
 font-size:40px;
 background:var(--grad);
 -webkit-background-clip:text;
 color:transparent;
}

.header{
 background:var(--grad);
 color:#fff;
 padding:25px;
 border-radius:15px;
 text-align:center;
}

.card{
 background:var(--card);
 padding:12px;
 border-radius:15px;
 margin-top:10px;
}

input,select{
 width:100%;
 padding:8px;
 margin-top:5px;
 border-radius:10px;
 border:1px solid #eee;
}

button{
 width:100%;
 padding:10px;
 margin-top:6px;
 border:none;
 border-radius:10px;
 background:var(--grad);
 color:#fff;
}

.progress{height:15px;background:#eee;border-radius:10px;}
.fill{height:100%;background:var(--grad);color:#fff;font-size:11px;text-align:center}

.estimasi{font-size:12px;color:#64748b}
.riwayat{font-size:12px}
.chart{height:200px;margin-top:10px}

#popup{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
z-index:9999;
}
#popup div{
background:#fff;
padding:20px;
border-radius:15px;
font-size:20px;
font-weight:bold;
}

#editModal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
z-index:9999;
}
#editModal .box{
background:var(--card);
padding:15px;
border-radius:15px;
width:90%;
max-width:350px;
}
</style>
</head>

<body>

<div id="splash">
<div class="logo">SavePlan</div>
<p>Nabung terarah, tujuan jadi nyata</p>
</div>

<div class="header">
<h2>✨ SavePlan</h2>
<div id="motivasi"></div>
</div>

<button onclick="document.body.classList.toggle('dark')">🎨 Ganti Tema</button>

<div style="display:flex;gap:5px;margin-top:10px;">
<button onclick="view='aktif';tampil()">Aktif</button>
<button onclick="view='selesai';tampil()">Selesai</button>
</div>

<div class="card">
<input id="barang" placeholder="Nama target">
<input id="target" type="number" placeholder="Target">

<select id="mode" onchange="cekMode()">
<option value="tetap">Tetap</option>
<option value="fleksibel">Fleksibel</option>
</select>

<select id="periode">
<option>Harian</option>
<option>Mingguan</option>
<option>Bulanan</option>
</select>

<div id="nominalBox">
<input id="nominal" placeholder="Nominal tetap">
</div>

<button onclick="tambah()">Tambah</button>
</div>

<div id="list"></div>

<div id="editModal">
<div class="box">
<h3>Edit Target</h3>

<input id="e_barang">
<input id="e_target" type="number">

<select id="e_mode">
<option value="tetap">Tetap</option>
<option value="fleksibel">Fleksibel</option>
</select>

<select id="e_periode">
<option>Harian</option>
<option>Mingguan</option>
<option>Bulanan</option>
</select>

<button onclick="saveEdit()">Simpan</button>
<button onclick="closeEdit()">Batal</button>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("data"))||[];
let charts={},pies={};
let view="aktif";
let editIndex=null;

function simpan(){
 localStorage.setItem("data",JSON.stringify(data));
}

function cekMode(){
 nominalBox.style.display=mode.value==="tetap"?"block":"none";
}

function tanggal(){
 return new Date().toLocaleDateString();
}

function tambah(){
 if(!barang.value||!target.value)return;

 data.push({
  barang:"🎯 "+barang.value,
  target:+target.value,
  nominal:+nominal.value||0,
  mode:mode.value,
  periode:periode.value,
  saldo:0,
  history:[],
  chart:[0],
  selesai:false
 });

 simpan();
 tampil();
}

function hapus(i){
 data.splice(i,1);
 simpan();
 tampil();
}

function edit(i){
 editIndex=i;
 let d=data[i];

 e_barang.value=d.barang;
 e_target.value=d.target;
 e_mode.value=d.mode;
 e_periode.value=d.periode;

 editModal.style.display="flex";
}

function closeEdit(){
 editModal.style.display="none";
}

function saveEdit(){
 if(editIndex===null)return;

 let d=data[editIndex];
 d.barang=e_barang.value;
 d.target=+e_target.value;
 d.mode=e_mode.value;
 d.periode=e_periode.value;

 simpan();
 tampil();
 closeEdit();
}

/* ================= FIX 100% STOP NABUNG ================= */
function nabung(i){
 let d=data[i];

 let persen=(d.saldo/d.target)*100;

 if(persen>=100){
  alert("🎉 Target sudah selesai!");
  return;
 }

 let val=d.mode==="tetap"
 ? d.nominal
 : +document.getElementById("flex"+i)?.value;

 if(!val)return;

 d.saldo+=val;
 d.chart.push(d.saldo);
 d.history.push({tipe:"in",value:val,tanggal:tanggal()});

 simpan();
 tampil();
}

function keluar(i){
 let val=+document.getElementById("out"+i).value;
 let ket=document.getElementById("ket"+i).value;
 let kat=document.getElementById("kat"+i).value;

 if(!val)return;

 let d=data[i];
 d.saldo-=val;

 d.history.push({
  tipe:"out",
  value:val,
  text:ket,
  kategori:kat,
  tanggal:tanggal()
 });

 simpan();
 tampil();
}

function estimasi(d){
 let rata=d.nominal||1000;
 let sisa=d.target-d.saldo;
 if(sisa<=0)return "🎉 Tercapai!";
 return "⏳ "+Math.ceil(sisa/rata)+" "+d.periode;
}

function tampil(){
 let html="";

 let show=data.map((d,i)=>({...d,_i:i}))
 .filter(d=>view==="aktif"? !d.selesai : d.selesai);

 show.forEach(d=>{
 let p=(d.saldo/d.target)*100 || 0;

 let disable = p>=100 ? "disabled style='opacity:0.5;'" : "";

 html+=`
 <div class="card">
 <b>${d.barang}</b><br>
 Rp ${d.saldo}/${d.target}

 <div class="progress">
 <div class="fill" style="width:${p}%">${p.toFixed(0)}%</div>
 </div>

 <div class="estimasi">${estimasi(d)}</div>

 ${d.mode==="fleksibel"
 ? `<input id="flex${d._i}" placeholder="Nominal">`
 : ""}

 <button onclick="nabung(${d._i})" ${disable}>+ Nabung</button>
 <button onclick="edit(${d._i})">✏️ Edit</button>
 <button onclick="hapus(${d._i})">Hapus</button>

 <div class="card">
 <input id="out${d._i}" placeholder="Nominal keluar">
 <input id="ket${d._i}" placeholder="keterangan">
 <select id="kat${d._i}">
  <option>makan</option>
  <option>transport</option>
  <option>kebutuhan</option>
  <option>kemauan</option>
 </select>
 <button onclick="keluar(${d._i})">Catat</button>
 </div>

 <div class="card">
 <b>📜 Riwayat</b>
 ${d.history.map(h=>`
  <div class="riwayat">
  ${h.tanggal} ${h.tipe==="in"?"➕":"➖"} ${h.value} ${h.text? "- "+h.text:""}
  </div>
 `).join("")}
 </div>

 <canvas id="c${d._i}" class="chart"></canvas>
 <canvas id="p${d._i}" class="chart"></canvas>
 </div>`;
 });

 list.innerHTML=html;
 setTimeout(draw,200);
}

function draw(){
 data.forEach((d,i)=>{
  let ctx=document.getElementById("c"+i);
  let pie=document.getElementById("p"+i);
  if(!ctx||!pie)return;

  if(charts[i])charts[i].destroy();
  if(pies[i])pies[i].destroy();

  charts[i]=new Chart(ctx,{
   type:"line",
   data:{labels:d.chart.map((_,x)=>x),datasets:[{data:d.chart}]}
  });

  let kategori={makan:0,transport:0,kebutuhan:0,kemauan:0};

  d.history.forEach(h=>{
   if(h.tipe==="out"){
    kategori[h.kategori]=(kategori[h.kategori]||0)+h.value;
   }
  });

  pies[i]=new Chart(pie,{
   type:"pie",
   data:{
    labels:Object.keys(kategori),
    datasets:[{data:Object.values(kategori)}]
   }
  });
 }

);
}

cekMode();
tampil();
</script>

</body>
</html>
